# Screenshots for the macOS install guide, on a Mac switched to Russian: the published disk image is "downloaded" with
# the same mark a browser puts, opened, and the program is started — what a person sees before allowing it.
# Run by hand (Actions → screens → Run workflow) or by a push to the screens branch. Results: ci-results/screens.
name: screens

on:
  workflow_dispatch:
  push:
    branches: [screens]

permissions:
  contents: write

# A new run cancels one still going: macOS may hold a run waiting for a permission nobody can click.
concurrency:
  group: screens
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Russian system language
        run: |
          defaults write -g AppleLanguages -array ru-RU en-US
          defaults write -g AppleLocale ru_RU
          sudo defaults write /Library/Preferences/.GlobalPreferences AppleLanguages -array ru-RU en-US
          sudo defaults write /Library/Preferences/.GlobalPreferences AppleLocale ru_RU
          killall cfprefsd Finder Dock SystemUIServer CoreServicesUIAgent UserNotificationCenter 2>/dev/null || true
          sudo killall cfprefsd 2>/dev/null || true
          sleep 5
      - name: build this version, as a release would
        run: |
          bash tools/mac/env.sh > env.log 2>&1 || { tail -30 env.log; exit 1; }
          BP_TARGET_ARCH=universal2 ../.venv-mac/bin/python tools/build.py "$RUNNER_TEMP/dist" > build.log 2>&1 || { tail -40 build.log; exit 1; }
          ls "$RUNNER_TEMP"/dist/*.dmg
      - name: screenshots
        continue-on-error: true
        timeout-minutes: 8
        run: bash tools/mac/screens.sh shots "$(ls "$RUNNER_TEMP"/dist/*.dmg)"
      - name: this version started normally — does macOS ask about the local network?
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p shots
          osascript -e 'quit app "System Settings"' 2>/dev/null || true
          killall CoreServicesUIAgent 2>/dev/null || true
          xattr -dr com.apple.quarantine "/Applications/Ценитель.app"
          open "/Applications/Ценитель.app" &
          for i in $(seq 1 60); do curl -fs -m 2 http://127.0.0.1:8769/api/ping && break; sleep 1; done > shots/local-network.log
          sleep 12
          screencapture -x shots/8-this-version-started.png
          curl -fs -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8769/api/quit || true
          sleep 8
      - name: install script, as a person would run it
        continue-on-error: true
        timeout-minutes: 8
        run: |
          mkdir -p shots
          osascript -e 'quit app "System Settings"' 2>/dev/null || true
          rm -rf "/Applications/Ценитель.app"
          bash tools/mac/install.sh < /dev/null 2>&1 | tee shots/install.log
          for i in $(seq 1 60); do curl -fs -m 2 http://127.0.0.1:8769/api/ping && break; sleep 1; done | tee -a shots/install.log
          sleep 6
          screencapture -x shots/9-after-install-script.png
          xattr -l "/Applications/Ценитель.app" | tee -a shots/install.log
          curl -fs -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8769/api/quit || true
      - name: publish to the ci-results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch ci-results "https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git" pub
          rm -rf pub/screens && mkdir -p pub/screens && cp -r shots/* pub/screens/ 2>/dev/null || true
          cd pub
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit --quiet -m "screens ${{ github.sha }}" || true
          git push --quiet origin HEAD:ci-results
